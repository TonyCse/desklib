<div class="flex min-h-dvh">
  <a
    href="#contenu"
    class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-surface focus:px-3 focus:py-2 focus:shadow-pop"
  >
    Aller au contenu
  </a>

  <aside class="hidden w-60 shrink-0 flex-col border-r border-line bg-surface md:flex" aria-label="Navigation principale">
    <div class="flex items-center gap-2 px-5 py-5">
      <span aria-hidden="true" class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-accent text-sm font-bold text-white">Î</span>
      <div>
        <p class="text-base font-semibold leading-tight">Îlot</p>
        <p class="text-xs text-ink-subtle">Meridia</p>
      </div>
    </div>

    <nav class="flex flex-col gap-1 px-3">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-accent-soft text-accent-ink"
          [routerLinkActiveOptions]="{ exact: false }"
          #rla="routerLinkActive"
          class="rounded-lg px-3 py-2 text-sm font-medium text-ink-muted hover:bg-canvas hover:text-ink"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex items-center justify-between gap-4 border-b border-line bg-surface px-4 py-3 md:px-8">
      <nav class="flex gap-2 overflow-x-auto md:hidden" aria-label="Navigation principale mobile">
        @for (item of navItems(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-accent-soft text-accent-ink"
            class="shrink-0 rounded-lg px-3 py-1.5 text-sm font-medium text-ink-muted"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="ml-auto flex items-center gap-3">
        @if (user(); as u) {
          <div class="hidden text-right sm:block">
            <p class="text-sm font-medium leading-tight">{{ u.firstName }} {{ u.lastName }}</p>
            <p class="text-xs text-ink-subtle">
              {{ roleLabel(u.role) }}@if (u.teamName) { · {{ u.teamName }} }
            </p>
          </div>
          <button
            type="button"
            class="rounded-lg border border-line-strong px-3 py-1.5 text-sm font-medium text-ink hover:bg-canvas"
            (click)="logout()"
          >
            Se déconnecter
          </button>
        }
      </div>
    </header>

    <main id="contenu" class="flex-1 px-4 py-6 md:px-8 md:py-8" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>

<app-toast-container />
