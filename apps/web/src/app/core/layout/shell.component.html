<div class="flex min-h-dvh" [class.h-dvh]="immersive()" [class.overflow-hidden]="immersive()">
  <a
    href="#contenu"
    class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-surface focus:px-3 focus:py-2 focus:shadow-pop"
  >
    Aller au contenu
  </a>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="flex flex-wrap items-center gap-x-6 gap-y-3 border-b border-line bg-surface px-4 py-3 md:px-8"
      [class.hidden]="immersive()"
    >
      <a routerLink="/plan" class="flex shrink-0 items-center gap-2.5">
        <span aria-hidden="true" class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-accent text-sm font-bold text-white">D</span>
        <span class="text-base font-semibold leading-tight">Desk’lib</span>
      </a>

      <nav class="flex min-w-0 gap-1 overflow-x-auto" aria-label="Navigation principale">
        @for (item of navItems(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-accent-soft text-accent-ink"
            [routerLinkActiveOptions]="{ exact: false }"
            #rla="routerLinkActive"
            class="shrink-0 rounded-lg px-3 py-1.5 text-sm font-medium text-ink-muted hover:bg-canvas hover:text-ink"
            [attr.aria-current]="rla.isActive ? 'page' : null"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="ml-auto flex items-center gap-3">
        @if (user(); as u) {
          <div class="hidden text-right sm:block">
            <p class="text-sm font-medium leading-tight">{{ u.firstName }} {{ u.lastName }}</p>
            <p class="text-xs text-ink-subtle">
              {{ roleLabel(u.role) }}@if (u.teamName) { · {{ u.teamName }} }
            </p>
          </div>
          <button
            type="button"
            class="rounded-lg border border-line-strong px-3 py-1.5 text-sm font-medium text-ink hover:bg-canvas"
            (click)="logout()"
          >
            Se déconnecter
          </button>
        }
      </div>
    </header>

    <main
      id="contenu"
      tabindex="-1"
      [class]="immersive() ? 'relative min-h-0 flex-1 p-0' : 'flex-1 px-4 py-6 md:px-8 md:py-8'"
    >
      <router-outlet />
    </main>
  </div>
</div>

<app-toast-container />
