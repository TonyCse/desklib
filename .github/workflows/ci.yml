name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, tests, build et parcours e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ilot
          POSTGRES_PASSWORD: ilot
          POSTGRES_DB: ilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Pas de fichier .env en CI : les variables viennent de l'environnement.
      DATABASE_URL: postgresql://ilot:ilot@localhost:5432/ilot?schema=public
      JWT_SECRET: ci-only-secret-with-more-than-32-characters-long
      WEB_ORIGIN: http://localhost:4200
      PORT: 3000
      NODE_ENV: test
      CI: true

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Client Prisma, migrations et seed
        # Avant le lint : le client généré est importé par l'API, le lint typé en a besoin.
        run: |
          npm run generate -w @desklib/api
          npm run db:migrate:deploy
          npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Tests unitaires et composants
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Navigateur pour les tests e2e
        run: npx playwright install --with-deps chromium

      - name: Tests e2e
        run: npm run e2e

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
